<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - URBAN PLANET</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap sec product-details">
  <span class="eyebrow">Product</span>
  <h1 class="product-name">Product Details</h1>
  <div class="product-image" style="margin:20px 0">Product image</div>
  <div class="product-price">₹0</div>
  <div class="variant-selector color-swatch size-selector" style="margin:20px 0">
    <button>Small</button><button>Medium</button><button>Large</button>
  </div>
  <button class="btn btn--solid add-to-cart buy-button">Add to cart</button>
  <button class="add-to-wishlist heart-icon" style="margin-left:8px">♡ Wishlist</button>
  <section class="product-review" style="margin-top:30px">
    <h2>Reviews</h2>
    <div class="star-rating">★★★★★</div>
  </section>
  <p style="margin-top:25px"><a href="shop.html">Back to shop</a></p>
</main>
</body>
</html>
