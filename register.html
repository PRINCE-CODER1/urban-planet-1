<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - URBAN PLANET</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap sec">
  <div class="pagehead">
    <span class="eyebrow">URBAN PLANET</span>
    <h1>Create Account</h1>
  </div>
  <form class="contact-form my-account" style="max-width:520px;margin:30px auto">
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn btn--solid btn--full" type="submit">Create account</button>
  </form>
  <p style="text-align:center;margin-top:18px">
    <a href="index.html">Back to store</a>
  </p>
</main>
</body>
</html>
